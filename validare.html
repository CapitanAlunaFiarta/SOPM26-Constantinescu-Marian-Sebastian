<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validare Bilet - CINEMA NIII7</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #070709; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 20px; }
        .valid-box { background: #12131a; border-top: 6px solid #2ecc71; padding: 40px; border-radius: 16px; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9); }
        .valid-icon { font-size: 70px; margin-bottom: 15px; }
        h1 { font-family: 'Oswald', sans-serif; color: #2ecc71; font-size: 2.4rem; letter-spacing: 2px; margin: 0 0 15px 0; }
        .details { font-size: 1.1rem; line-height: 1.8; color: #9ba1b0; border-top: 1px solid #25262b; padding-top: 20px; }
        .highlight { color: #fff; font-weight: 800; }
        .seats-pill { background: #ff6600; color: #000; font-weight: 800; font-size: 1.3rem; padding: 10px 20px; border-radius: 8px; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="valid-box" id="result-box">
        <div class="valid-icon">✅</div>
        <h1>BILET VALID — ACCES PERMIS</h1>
        <div class="details" id="ticket-details">Se verifică datele...</div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.has('film')) {
            const film = params.get('film');
            const data = params.get('data');
            const ora = params.get('ora');
            const locuri = params.get('locuri');
            document.getElementById('ticket-details').innerHTML = `
                <p>FILM: <span class="highlight">${film}</span></p>
                <p>DATA: <span class="highlight">${data}</span></p>
                <p>ORA: <span class="highlight">${ora}</span></p>
                <div class="seats-pill">LOCURI: ${locuri}</div>
            `;
        } else {
            document.getElementById('result-box').innerHTML = `<div class="valid-icon">❌</div><h1 style="color:#ff3b30;">BILET INVALID</h1><p style="color:#9ba1b0;">Acest cod QR nu figurează în baza de date Cinema NIII7.</p>`;
            document.getElementById('result-box').style.borderTopColor = '#ff3b30';
        }
    </script>
</body>
</html>
